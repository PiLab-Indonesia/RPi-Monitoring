name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: pytest and flake8 (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: python -m pip install pytest flake8
      - name: Test database model
        run: python -m pytest -q tests
      - name: Check Python syntax and critical lint errors
        run: python -m flake8 . --select=E9,F63,F7,F82 --show-source
